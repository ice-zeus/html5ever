[workspace]
resolver = "2"
members = [
    "web_atoms",
    "markup5ever",
    "html5ever",
    "rcdom",
    "xml5ever",
    "tendril",
    "tendril-bench",
]

[workspace.package]
version = "0.40.1"
license = "MIT OR Apache-2.0"
authors = [ "The html5ever Project Developers" ]
repository = "https://github.com/servo/html5ever"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
# Repo dependencies
# VIPER-PATCH(registry-deps): Viper pins only html5ever from this fork. Its
# markup5ever, and markup5ever's tendril and web_atoms, come from crates.io
# at the versions Viper builds with (markup5ever 0.40.0 and web_atoms 0.3.0
# have this commit's sources; tendril 0.5.1 is older than this commit's), so
# a git pin of html5ever changes no other package. See PATCHES.md.
tendril = "=0.5.1"
web_atoms = "=0.3.0"
markup5ever = "=0.40.0"
xml5ever = { version = "0.40", path = "xml5ever" }
html5ever = { version = "0.40", path = "html5ever" }

# External dependencies
encoding_rs = "0.8.12"
log = "0.4"
memchr = "2.8.0"
new_debug_unreachable = "1.0.2"
phf = "0.14"
phf_codegen = "0.14"
string_cache = { version = "0.11.0", default-features = false }
string_cache_codegen = "0.11.0"

# Dev dependencies
criterion = "0.8"
env_logger = "0.11"
libtest-mimic = "0.8.1"
rand = "0.9"
serde_json = "1.0"
typed-arena = "2.0.2"
